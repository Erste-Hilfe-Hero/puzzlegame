plugins { id 'com.android.application' }

def ks = file(System.getenv('CB_KEYSTORE') ?: 'none')

android {
    namespace 'com.nyrathen.cheatbook'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nyrathen.cheatbook'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('CB_VERSION_CODE') ?: '1')
        versionName '1.0.0'
    }
    signingConfigs {
        upload {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('CB_KEYSTORE_PASS')
                keyAlias 'upload'
                keyPassword System.getenv('CB_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ks.exists()) signingConfig signingConfigs.upload
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ["$buildDir/www-assets"] } }
}

tasks.register('copyWeb', Copy) {
    from("$rootDir/../web") { exclude '**/.DS_Store' }
    into "$buildDir/www-assets/www"
}
preBuild.dependsOn copyWeb
