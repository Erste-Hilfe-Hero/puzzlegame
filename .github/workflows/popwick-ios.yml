# Popwick (iPhone Duo game): unsigned iOS archive on a free GitHub macOS runner (repo is public).
# Signing and App Store upload happen on the Contabo host. Trigger: commit message containing "run:popwick-ios", or manual.
# The iPhone Duo hinge API needs the iOS 27.1 SDK: DUO_HINGE is set only when Xcode 27.1+ is on the runner.
name: Popwick iOS build
on:
  push:
    branches: [main, claude/project-thread-wly2tk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run:popwick-ios')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          echo "xcode: $X"; [ -n "$X" ] && sudo xcode-select -s "$X"; xcodebuild -version
          V=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$(printf '%s\n27.1\n' "$V" | sort -V | head -1)" = "27.1" ]; then echo "FLAGS=DUO_HINGE" >> $GITHUB_ENV; echo "hinge API: on"; else echo "FLAGS=" >> $GITHUB_ENV; echo "hinge API: off (Xcode $V)"; fi
      - name: Generate project
        run: brew install xcodegen && cd popwick/ios && xcodegen generate
      - name: Archive (unsigned)
        run: |
          cd popwick/ios
          xcodebuild -project Popwick.xcodeproj -scheme Popwick -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/pw.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$FLAGS" archive | tail -40
          cd $RUNNER_TEMP/pw.xcarchive/Products/Applications && ditto -c -k --keepParent Popwick.app $RUNNER_TEMP/Popwick-unsigned.zip
      - name: Push unsigned app to branch popwick-ios-out/<run> (for the signing host)
        run: |
          mkdir -p $RUNNER_TEMP/out && cd $RUNNER_TEMP/out && cp ../Popwick-unsigned.zip .
          echo "xcode=$(xcodebuild -version | head -1) flags=$FLAGS" > build-info.txt
          git init -q -b main && git config user.name ci && git config user.email ci@invalid
          git add . && git commit -qm "popwick ios unsigned ${{ github.run_number }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/popwick-ios-out/${{ github.run_number }}
