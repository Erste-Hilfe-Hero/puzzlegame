# Unsigned iOS archive on a free GitHub macOS runner (repo is public). Signing and App Store upload happen
# on the Contabo host with the account's keys. Trigger: commit message containing "run:ios", or manual.
name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run:ios')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Archive (unsigned)
        run: |
          cd ios
          xcodebuild -project AmysTastyIsland.xcodeproj -scheme AmysTastyIsland -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/ati.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO archive | tail -40
          cd $RUNNER_TEMP/ati.xcarchive/Products/Applications && ditto -c -k --keepParent AmysTastyIsland.app $RUNNER_TEMP/AmysTastyIsland-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/AmysTastyIsland-unsigned.zip
          retention-days: 30
      - name: Push unsigned app to branch ios-out/<run> (for the signing host)
        run: |
          mkdir -p $RUNNER_TEMP/out && cd $RUNNER_TEMP/out && cp ../AmysTastyIsland-unsigned.zip .
          git init -q -b main && git config user.name ci && git config user.email ci@invalid
          git add . && git commit -qm "ios unsigned ${{ github.run_number }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ios-out/${{ github.run_number }}
