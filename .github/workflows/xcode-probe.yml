# Lists Xcode versions on newer hosted macOS images (looking for Xcode 27.1 = iOS 27.1 SDK for the iPhone Duo hinge API).
name: Xcode probe
on:
  push:
    branches: [claude/project-thread-wly2tk]
    paths: [.github/workflows/xcode-probe.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-27, macos-26-xlarge, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: ls -d /Applications/Xcode*.app; ls /Library/Developer/CoreSimulator/Profiles/Runtimes 2>/dev/null || true; xcodebuild -version
