<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Amy's Tasty Island</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="x-core.css">
</head>
<body>
<div id="scene" aria-hidden="true"><svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc3f7"/><stop offset=".55" stop-color="#9be7ff"/><stop offset="1" stop-color="#fff3c4"/></linearGradient>
<linearGradient id="se" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2bb8d9"/><stop offset=".6" stop-color="#34d1c6"/><stop offset="1" stop-color="#8ff0dc"/></linearGradient>
<linearGradient id="sa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9b0"/><stop offset="1" stop-color="#f4c978"/></linearGradient>
<radialGradient id="su"><stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#fff3a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff3a8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="300" fill="url(#sk)"/>
<circle cx="318" cy="96" r="120" fill="url(#su)"/><circle cx="318" cy="96" r="34" fill="#fffbe6"/>
<g fill="#fff" opacity=".95"><path d="M30 150a18 18 0 0 1 30-12a24 24 0 0 1 44 6a16 16 0 0 1 6 31H38a15 15 0 0 1-8-25z"/><path d="M228 196a13 13 0 0 1 22-9a18 18 0 0 1 33 5a12 12 0 0 1 4 23h-53a11 11 0 0 1-6-19z" opacity=".8"/><path d="M140 74a10 10 0 0 1 17-7a14 14 0 0 1 25 4a9 9 0 0 1 3 17h-40a8 8 0 0 1-5-14z" opacity=".7"/></g>
<path d="M0 262q40-34 86-20q30-30 70-8q26-14 50 14q20 2 30 14H0z" fill="#5fc27a"/><path d="M0 262q46-20 92-10q40-18 84 2q30 0 60 8H0z" fill="#3fa868"/>
<path d="M290 262q30-26 60-14q26-10 50 6v8z" fill="#4db571"/>
<rect y="258" width="400" height="330" fill="url(#se)"/>
<g stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".55"><path d="M20 290q10-6 20 0t20 0"/><path d="M250 310q10-6 20 0t20 0"/><path d="M120 350q10-6 20 0t20 0"/><path d="M310 400q10-6 20 0t20 0"/><path d="M40 440q10-6 20 0t20 0"/><path d="M200 500q10-6 20 0t20 0"/></g>
<path d="M0 600q50-22 100-6t100-4t100 8t100-10v212H0z" fill="#fff" opacity=".85"/>
<path d="M0 612q50-22 100-6t100-4t100 8t100-10v200H0z" fill="url(#sa)"/>
<g fill="#eab765" opacity=".6"><circle cx="40" cy="690" r="3"/><circle cx="120" cy="740" r="2"/><circle cx="300" cy="700" r="3"/><circle cx="350" cy="770" r="2"/><circle cx="200" cy="780" r="2.5"/></g>
<path d="M352 742l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#ff8a7a"/>
<g transform="translate(-14 -8)"><path d="M0 0q70 4 108 58q-52-34-108-22z" fill="#2f9e5b"/><path d="M0 0q88-18 142 22q-70-14-142 14z" fill="#3fb86b"/><path d="M0 0q40 30 44 98q-22-56-44-62z" fill="#2a8f52"/></g>
<g transform="translate(414 -8) scale(-1 1)"><path d="M0 0q70 4 108 58q-52-34-108-22z" fill="#2f9e5b"/><path d="M0 0q88-18 142 22q-70-14-142 14z" fill="#3fb86b"/><path d="M0 0q40 30 44 98q-22-56-44-62z" fill="#2a8f52"/></g>
</svg></div>
<div id="app">
  <header id="top">
    <div class="lvl"><img data-ic="ui_xp" alt=""><span id="lvl">1</span><div class="xpbar"><div id="xp"></div></div></div>
    <div class="res" id="res-energy"><img data-ic="ui_energy" alt=""><span id="energy">100</span><small id="energy-timer"></small></div>
    <div class="res"><img data-ic="ui_coin" alt=""><span id="coins">0</span></div>
    <button class="res" id="res-gems"><img data-ic="ui_gem" alt=""><span id="gems">0</span><b>+</b></button>
    <button id="btn-settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4L10.700 6a7.6 7.6 0 0 0-1.700 1l-2.400-1-2 3.400L6.600 11a7.500 7.500 0 0 0 0 2l-2 1.600 2 3.400 2.400-1a7.600 7.600 0 0 0 1.700 1l.300 2.500h4l.300-2.500a7.600 7.600 0 0 0 1.700-1l2.400 1 2-3.400zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
  </header>
  <div id="boosts"></div>
  <section id="orders"></section>
  <div id="tut" hidden></div>
  <main id="board"></main>
  <div id="strip"><div id="info"></div><button id="btn-undo" hidden></button><button id="btn-sell" hidden>Sell</button></div>
  <nav id="nav">
    <button id="btn-island"><img data-ic="ui_island" alt=""><span></span></button>
    <button id="btn-daily"><img data-ic="ui_daily" alt=""><span></span><i hidden></i></button>
    <button id="btn-shop" class="big"><img data-ic="ui_shop" alt=""><span></span></button>
    <button id="btn-store"><img data-ic="ui_store" alt=""><span></span><i hidden></i></button>
    <button id="btn-album"><img data-ic="ui_album" alt=""><span></span><i hidden></i></button>
  </nav>
</div>
<div id="amy-pop" hidden><img data-ic="amy_face" alt=""><span></span></div>
<div id="combo" hidden></div>
<div id="ghost" hidden></div>
<div id="toast" hidden></div>
<div id="modal" hidden role="dialog" aria-modal="true"><div class="sheet" tabindex="-1"><button class="close" id="modal-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></button><div id="modal-body"></div></div></div>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="x-core.js"></script>
<script src="game.js"></script>
</body>
</html>
